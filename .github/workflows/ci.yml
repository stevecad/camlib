name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Documentation-only changes (Markdown, the license) need no build or tests:
  # the jobs below are skipped, which branch protection counts as passing.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Any changed file that is not Markdown or the license needs the full CI.
          code_files=$(git diff --name-only "$BASE" HEAD | grep -vE '(\.md$|^LICENSE$)' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          PYO3_PYTHON: python
      - name: Tests
        run: cargo test --release --workspace --all-features --lib --tests
        env:
          PYO3_PYTHON: python
      - name: Doctests
        run: cargo test --release --doc

  msrv:
    name: Rust 1.88 (minimum supported version) builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-features --all-targets
        env:
          PYO3_PYTHON: python

  python:
    name: Python (ruff, tests with CadQuery)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CadQuery and ruff
        run: python -m pip install cadquery ruff
      - name: Ruff
        run: |
          ruff check python examples bench
          ruff format --check python examples bench
      - name: Build the engine and Python extension
        run: cargo build --release --workspace --all-features
        env:
          PYO3_PYTHON: python
      - name: Tests
        run: python -m unittest discover -s python/tests
        env:
          PYTHONPATH: python
      - name: Examples
        run: |
          python examples/standalone_job.py out
          python examples/cadquery_job.py out-cad
        env:
          PYTHONPATH: python

  bench:
    name: Benchmarks (informational)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CadQuery
        run: python -m pip install cadquery
      - name: Build the engine and Python extension
        run: cargo build --release --workspace --all-features
        env:
          PYO3_PYTHON: python
      - name: Run the toolpath benchmarks
        run: python bench/run.py --label github-ubuntu-latest --repeat 3
      - name: Render the report
        if: always()
        run: python bench/report.py bench/results/github-ubuntu-latest.json --out bench-report.md
      # Toolpath data is host-independent: any difference from the committed
      # baseline is a real toolpath change (update the baseline in the PR).
      - name: Compare toolpaths with the baseline
        shell: bash
        run: python bench/compare.py bench/results/baseline.json bench/results/github-ubuntu-latest.json | tee bench-compare.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-${{ github.sha }}
          # Small, but one per push: keep them only briefly.
          retention-days: 7
          path: |
            bench/results/github-ubuntu-latest.json
            bench-report.md
            bench-compare.md
