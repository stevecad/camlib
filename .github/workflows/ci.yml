name: CI

# Pull requests only: main is protected and every PR must be up to date with
# main and green before it merges, so the merged tree is already tested; a
# second run after the merge would only repeat it. Run manually if needed.
on:
  pull_request:
  # The merge queue (#148) runs the required checks on each queued batch:
  # the PRs combined with main, exactly as they will land.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Rust version is pinned (dtolnay/rust-toolchain@1.100 below), not
# "stable": clippy gains lints with every release, and with -D warnings a new
# release failed every open pull request on code none of them touched. Raise
# it in a pull request of its own, with whatever the new clippy asks for.
# The minimum supported version (1.88) has its own job.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Documentation-only changes (Markdown, the license) need no build or tests:
  # the jobs below are skipped, which branch protection counts as passing.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          # The merge base: the PR's base, a queued batch's main, else the
          # previous commit of a push. Empty (unknown) runs everything.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Any changed file that is not Markdown or the license needs the full CI.
          code_files=$(git diff --name-only "$BASE" HEAD | grep -vE '(\.md$|^LICENSE$)' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (${{ matrix.os }}, fmt, clippy, tests)
    # Skipped step by step, not as a job: a skipped matrix job reports one
    # unexpanded check name that the required checks never match.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.100
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --check
      - name: Clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          PYO3_PYTHON: python
      - name: Tests
        if: needs.changes.outputs.code == 'true'
        # The `ci` profile: release optimisation without LTO (see Cargo.toml).
        run: cargo test --profile ci --workspace --all-features --lib --tests
        env:
          PYO3_PYTHON: python
      - name: Doctests
        if: needs.changes.outputs.code == 'true'
        run: cargo test --profile ci --doc

  msrv:
    name: Rust 1.88 (minimum supported version) builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-features --all-targets
        env:
          PYO3_PYTHON: python

  python:
    name: Python (${{ matrix.os }}, ruff, tests with CadQuery)
    # Skipped step by step, not as a job: a skipped matrix job reports one
    # unexpanded check name that the required checks never match.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.100
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install CadQuery and ruff
        if: needs.changes.outputs.code == 'true'
        run: python -m pip install cadquery ruff
      - name: Ruff
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          ruff check python examples bench
          ruff format --check python examples bench
      - name: Build the engine and Python extension
        if: needs.changes.outputs.code == 'true'
        run: cargo build --release --workspace --all-features
        env:
          PYO3_PYTHON: python
      - name: Tests
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s python/tests
        env:
          PYTHONPATH: python
      - name: Benchmark platform tests
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s bench -p "test_*.py"

  bench:
    name: Benchmarks (informational)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
      - name: Install CadQuery
        run: python -m pip install cadquery
      - name: Build the engine and Python extension
        run: cargo build --release --workspace --all-features
        env:
          PYO3_PYTHON: python
      - name: Run the toolpath benchmarks
        run: python bench/run.py --label github-ubuntu-latest --repeat 3
      - name: Render the report
        if: always()
        run: python bench/report.py bench/results/github-ubuntu-latest.json --out bench-report.md
      # Toolpath data is host-independent: any difference from the committed
      # baseline is a real toolpath change (update the baseline in the PR).
      - name: Compare toolpaths with the baseline
        shell: bash
        run: python bench/compare.py bench/results/baseline.json bench/results/github-ubuntu-latest.json | tee bench-compare.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-${{ github.sha }}
          # Small, but one per push: keep them only briefly.
          retention-days: 7
          path: |
            bench/results/github-ubuntu-latest.json
            bench-report.md
            bench-compare.md

  windows-wheel:
    name: Windows wheel (installed package)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install into a path containing spaces
        shell: pwsh
        run: |
          python -m venv 'wheel environment'
          $wheel = (Get-ChildItem dist/cam_engine-*-win_amd64.whl).FullName
          & '.\wheel environment\Scripts\python.exe' -m pip install $wheel cadquery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed package without source-build fallback
        shell: pwsh
        run: |
          Rename-Item target target-hidden
          & '.\wheel environment\Scripts\python.exe' -m unittest discover -s python/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: camlib-windows-x64-wheel
          path: dist/*.whl
          retention-days: 14
